name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Add google-services.json from secret
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GS" || { echo "Missing secret GOOGLE_SERVICES_JSON"; exit 1; }
          printf '%s' "$GS" > google-services.json
      - name: Install and bundle web app
        run: |
          npm install
          npm run build
      - name: Create Android project
        run: |
          npx cap add android
          cp google-services.json android/app/google-services.json
          npx cap sync android
      - name: Keep a stable debug keystore (keeps the SHA-1 the same between builds)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: studymate-debug-keystore-v1
      - name: Ensure debug keystore and print SHA-1
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA256"
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: studymate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
